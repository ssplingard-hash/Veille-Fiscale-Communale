name: Debug scraper Liège

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Récupération du dépôt
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Installation de Node.js
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # 3. Installation UNIQUEMENT des dépendances du scraper
      #
      # On ne fait PAS npm ci :
      # le projet React contient react-simple-maps, incompatible
      # avec React 19, et cela n'a rien à voir avec notre scraper.
      # ============================================================
      - name: Install scraper dependencies
        run: |
          npm install --no-save --legacy-peer-deps puppeteer cheerio

      # ============================================================
      # 4. Vérification de l'environnement
      # ============================================================
      - name: Check environment
        run: |
          echo "=============================================="
          echo "ENVIRONNEMENT"
          echo "=============================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Puppeteer:"
          node -e "console.log(require('puppeteer/package.json').version)"

          echo ""
          echo "Cheerio:"
          node -e "console.log(require('cheerio/package.json').version)"

      # ============================================================
      # 5. Vérification des fichiers
      # ============================================================
      - name: Check scraper files
        run: |
          echo "=============================================="
          echo "VERIFICATION DES FICHIERS"
          echo "=============================================="

          echo ""
          echo "Scraper principal:"
          test -f scripts/scrape-reglements-taxes.mjs
          echo "OK"

          echo ""
          echo "Debug scraper:"
          test -f scripts/debug-scraper.mjs
          echo "OK"

          echo ""
          echo "JSON:"
          test -f src/data/reglements-taxes.json
          echo "OK"

      # ============================================================
      # 6. Sauvegarde du JSON avant le debug
      #
      # Le debug ne doit pas modifier le fichier de production.
      # ============================================================
      - name: Save JSON checksum
        run: |
          echo "=============================================="
          echo "CHECKSUM JSON AVANT DEBUG"
          echo "=============================================="

          sha256sum src/data/reglements-taxes.json

      # ============================================================
      # 7. Affichage de la structure actuelle du JSON
      # ============================================================
      - name: Inspect current JSON
        run: |
          echo "=============================================="
          echo "STRUCTURE DU JSON ACTUEL"
          echo "=============================================="

          node <<'NODE'
          const fs = require('fs');

          const file = 'src/data/reglements-taxes.json';

          try {
            const data = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            console.log(
              'Type racine :',
              Array.isArray(data)
                ? 'array'
                : typeof data
            );

            if (
              data &&
              typeof data === 'object' &&
              !Array.isArray(data)
            ) {
              console.log(
                'Clés racine :',
                Object.keys(data)
              );
            }

            console.log('');
            console.log('Premiers éléments :');

            console.log(
              JSON.stringify(data, null, 2).slice(0, 5000)
            );

          } catch (error) {
            console.error(
              'Impossible de lire le JSON :'
            );

            console.error(error);
            process.exit(1);
          }
          NODE

      # ============================================================
      # 8. LANCEMENT DU DEBUG SCRAPER
      # ============================================================
      - name: Run debug scraper
        run: |
          echo "=============================================="
          echo "DEBUG SCRAPER LIEGE"
          echo "=============================================="
          echo ""

          node scripts/debug-scraper.mjs

      # ============================================================
      # 9. Vérification que le JSON n'a PAS été modifié
      # ============================================================
      - name: Verify JSON unchanged
        run: |
          echo "=============================================="
          echo "VERIFICATION JSON APRES DEBUG"
          echo "=============================================="

          sha256sum src/data/reglements-taxes.json

          if git diff --quiet -- src/data/reglements-taxes.json; then
            echo ""
            echo "OK : le JSON n'a pas été modifié."
          else
            echo ""
            echo "ERREUR : le debug a modifié le JSON."
            echo ""
            git diff -- src/data/reglements-taxes.json
            exit 1
          fi

      # ============================================================
      # 10. Fin
      # ============================================================
      - name: Debug summary
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "FIN DU DEBUG"
          echo "=============================================="
          echo ""
          echo "Aucun déploiement n'a été effectué."
