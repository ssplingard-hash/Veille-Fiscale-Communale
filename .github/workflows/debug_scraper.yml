name: Debug scraper Liège

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Récupération du dépôt
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Installation de Node.js
      # ------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ------------------------------------------------------------
      # 3. Installation des dépendances
      # ------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # 4. Vérification de Puppeteer
      # ------------------------------------------------------------
      - name: Install Puppeteer if necessary
        run: npm install --no-save --legacy-peer-deps puppeteer cheerio

      # ------------------------------------------------------------
      # 5. Vérification des fichiers nécessaires
      # ------------------------------------------------------------
      - name: Check scraper files
        run: |
          echo "=============================================="
          echo "VERIFICATION DES FICHIERS"
          echo "=============================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Scraper:"
          test -f scripts/scrape-reglements-taxes.mjs
          echo "OK - scripts/scrape-reglements-taxes.mjs"

          echo ""
          echo "Debug:"
          test -f scripts/debug-scraper.mjs
          echo "OK - scripts/debug-scraper.mjs"

          echo ""
          echo "JSON:"
          test -f src/data/reglements-taxes.json
          echo "OK - src/data/reglements-taxes.json"

      # ------------------------------------------------------------
      # 6. Affichage de la structure actuelle du JSON
      # ------------------------------------------------------------
      - name: Inspect current JSON
        run: |
          echo "=============================================="
          echo "JSON ACTUEL"
          echo "=============================================="

          node <<'NODE'
          const fs = require('fs');

          const file = 'src/data/reglements-taxes.json';

          try {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            console.log('Type racine :', Array.isArray(data) ? 'array' : typeof data);

            if (data && typeof data === 'object' && !Array.isArray(data)) {
              console.log('Clés racine :', Object.keys(data));
            }

            console.log('');
            console.log('Structure complète :');
            console.log(JSON.stringify(data, null, 2).slice(0, 10000));
          } catch (error) {
            console.error('Impossible de lire le JSON :');
            console.error(error);
            process.exit(1);
          }
          NODE

      # ------------------------------------------------------------
      # 7. Lancement du diagnostic
      #
      # IMPORTANT :
      # ce script est diagnostique.
      # Il ne doit PAS modifier le JSON de production.
      # ------------------------------------------------------------
      - name: Run diagnostic
        run: |
          echo "=============================================="
          echo "LANCEMENT DU DEBUG SCRAPER"
          echo "=============================================="
          echo ""

          node scripts/debug-scraper.mjs

      # ------------------------------------------------------------
      # 8. Vérification finale du JSON
      #
      # Le diagnostic ne doit pas modifier le fichier.
      # ------------------------------------------------------------
      - name: Verify JSON unchanged
        run: |
          echo "=============================================="
          echo "VERIFICATION FINALE"
          echo "=============================================="

          if git diff --quiet -- src/data/reglements-taxes.json; then
            echo "OK - le JSON de production n'a pas été modifié."
          else
            echo ""
            echo "ERREUR : le diagnostic a modifié src/data/reglements-taxes.json."
            echo ""
            git diff -- src/data/reglements-taxes.json
            exit 1
          fi

      # ------------------------------------------------------------
      # 9. Résumé
      # ------------------------------------------------------------
      - name: Debug summary
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "FIN DU DEBUG"
          echo "=============================================="
          echo ""
          echo "Le workflow était uniquement destiné au diagnostic."
          echo "Aucun déploiement n'a été effectué."
