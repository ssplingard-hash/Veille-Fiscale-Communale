name: Debug scraper Liège

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: |
          npm install --no-save --legacy-peer-deps cheerio puppeteer

      - name: Vérifier le scraper
        run: |
          echo "========================================"
          echo "TEST DU SCRAPER LIÈGE"
          echo "========================================"
          node scripts/scrape-reglements-taxes.mjs

      - name: Afficher le résultat Liège
        run: |
          echo ""
          echo "========================================"
          echo "CONTENU DE REGLEMENTS-TAXES.JSON"
          echo "========================================"
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('src/data/reglements-taxes.json', 'utf8'));
          console.log(JSON.stringify(data['Liège'], null, 2));
          "
