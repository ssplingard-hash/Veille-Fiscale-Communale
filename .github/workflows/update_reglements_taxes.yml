name: Update règlements-taxes (Wallonie + Bruxelles)

on:
  schedule:
    # Tous les jours à 6h00 UTC (avant le build/deploy de 6h00 déjà existant :
    # on le déclenche 15 min plus tôt pour que les nouvelles données soient
    # incluses dans le déploiement du jour).
    - cron: '45 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper dependency (cheerio)
        run: npm install --no-save --legacy-peer-deps cheerio

      - name: Run scraper (communes wallonnes - deliberations.be)
        run: node scripts/scrape-reglements-taxes.mjs

      - name: Run scraper (communes bruxelloises - sites officiels)
        run: node scripts/scrape-reglements-taxes-bruxelles.mjs

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name "reglements-taxes-bot"
          git config user.email "actions@github.com"
          git add src/data/reglements-taxes.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Mise à jour quotidienne des règlements-taxes (Wallonie + Bruxelles)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher le rebuild et déploiement du site
        # Un commit fait par un bot avec le GITHUB_TOKEN par défaut ne déclenche PAS
        # automatiquement les autres workflows (règle anti-boucle infinie de GitHub).
        # On force donc explicitement l'exécution du workflow de déploiement ici,
        # sans attendre son prochain cron quotidien.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_data.yml --ref main
