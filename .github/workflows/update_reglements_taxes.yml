name: Update règlements-taxes (Wallonie + Bruxelles)

on:
  schedule:
    # Tous les jours à 6h00 UTC (avant le build/deploy de 6h00 déjà existant :
    # on le déclenche 15 min plus tôt pour que les nouvelles données soient
    # incluses dans le déploiement du jour).
    - cron: '45 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper dependencies (cheerio + puppeteer)
        run: npm install --no-save --legacy-peer-deps cheerio puppeteer

      - name: Run scraper (communes wallonnes - deliberations.be, via navigateur headless)
        run: node scripts/scrape-reglements-taxes.mjs

      - name: Run scraper (communes bruxelloises - sites officiels)
        run: node scripts/scrape-reglements-taxes-bruxelles.mjs

      - name: Commit updated data (if changed)
        id: commit
        run: |
          git config user.name "reglements-taxes-bot"
          git config user.email "actions@github.com"
          git add src/data/reglements-taxes.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # Le job peut durer plusieurs heures : si main a été modifié entre-temps
            # (ex: une correction manuelle sur GitHub), on se resynchronise d'abord
            # avec origin/main, puis on réapplique systématiquement le résultat
            # fraîchement scrapé par-dessus — il doit toujours l'emporter, cette
            # donnée étant plus récente et plus fiable que tout état intermédiaire.
            cp src/data/reglements-taxes.json /tmp/reglements-taxes-fresh.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/reglements-taxes-fresh.json src/data/reglements-taxes.json
            git add src/data/reglements-taxes.json
            git commit -m "Mise à jour quotidienne des règlements-taxes (Wallonie + Bruxelles)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher le rebuild et déploiement du site
        # Un commit fait par un bot avec le GITHUB_TOKEN par défaut ne déclenche PAS
        # automatiquement les autres workflows (règle anti-boucle infinie de GitHub).
        # On force donc explicitement l'exécution du workflow de déploiement ici,
        # sans attendre son prochain cron quotidien.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_data.yml --ref main
