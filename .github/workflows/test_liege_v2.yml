name: Test Liège 2026 - Documents

on:
  workflow_dispatch:

jobs:
  test-liege-documents:
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Puppeteer
        run: |
          npm install --no-save --legacy-peer-deps puppeteer cheerio

      - name: Vérifier les fichiers
        run: |
          test -f scripts/scrape-liege-2026-v2.mjs
          test -f scripts/extract-liege-documents.mjs
          echo "✓ Fichiers présents"

      - name: Collecter les décisions Liège 2026
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Vérifier les décisions 2026
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const file = 'tmp/liege-2026-analysis.json';

          if (!fs.existsSync(file)) {
            throw new Error(`Fichier introuvable : ${file}`);
          }

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log(`Commune : ${data.commune}`);
          console.log(`Année : ${data.annee}`);
          console.log(`Décisions : ${data.count}`);

          if (data.commune !== 'Liège') {
            throw new Error('Commune incorrecte');
          }

          if (data.annee !== 2026) {
            throw new Error('Année incorrecte');
          }

          if (data.count < 500) {
            throw new Error(
              `Sécurité : seulement ${data.count} décisions`
            );
          }

          for (const decision of data.decisions) {
            if (
              !decision.date ||
              decision.date.year !== 2026
            ) {
              throw new Error(
                `Décision non-2026 : ${decision.url}`
              );
            }
          }

          console.log('✓ Décisions 2026 validées');
          EOF

      - name: Extraire les documents
        run: |
          node scripts/extract-liege-documents.mjs

      - name: Vérifier les documents
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const file =
            'tmp/liege-2026-documents.json';

          if (!fs.existsSync(file)) {
            throw new Error(
              `Fichier introuvable : ${file}`
            );
          }

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log('');
          console.log('================================');
          console.log('VÉRIFICATION');
          console.log('================================');
          console.log(
            `Décisions : ${data.count}`
          );
          console.log(
            `Avec documents : ${data.withDocuments}`
          );
          console.log(
            `Sans documents : ${data.withoutDocuments}`
          );
          console.log(
            `Avec PDF : ${data.withPdf}`
          );
          console.log(
            `Pages en erreur : ${data.failedPages}`
          );

          if (data.commune !== 'Liège') {
            throw new Error('Commune incorrecte');
          }

          if (data.annee !== 2026) {
            throw new Error('Année incorrecte');
          }

          if (data.count < 500) {
            throw new Error(
              `Seulement ${data.count} décisions`
            );
          }

          if (data.failedPages > 50) {
            throw new Error(
              `Trop de pages en erreur : ${data.failedPages}`
            );
          }

          for (const decision of data.decisions) {
            if (
              !decision.date ||
              decision.date.year !== 2026
            ) {
              throw new Error(
                `Décision non-2026 : ${decision.url}`
              );
            }

            if (
              !Array.isArray(decision.documents)
            ) {
              throw new Error(
                `Documents invalides : ${decision.url}`
              );
            }
          }

          console.log('');
          console.log('✓ Vérification terminée');
          EOF

      - name: Vérifier que la production est intacte
        run: |
          if git diff --quiet -- src/data/reglements-taxes.json; then
            echo "✓ Données de production inchangées"
          else
            echo "❌ DONNÉES DE PRODUCTION MODIFIÉES"
            exit 1
          fi

      - name: Résumé
        run: |
          echo ""
          echo "=============================================="
          echo " TEST TERMINÉ"
          echo "=============================================="
          echo ""
          echo "Collecte 2026 : OK"
          echo "Extraction des documents : OK"
          echo "Production : inchangée"
          echo ""

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-documents
          path: |
            tmp/liege-2026-analysis.json
            tmp/liege-2026-documents.json
          retention-days: 7
