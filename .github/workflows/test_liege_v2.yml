name: Test Liège 2026 V2

on:
  workflow_dispatch:

jobs:
  test-liege:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: |
          npm install --no-save --legacy-peer-deps puppeteer

      - name: Run collector
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Verify result
        run: |

          test -f tmp/liege-2026-analysis.json

          node - <<'NODE'

          const fs = require("fs");

          const file =
            "tmp/liege-2026-analysis.json";

          const data =
            JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          console.log("================================");
          console.log("VÉRIFICATION");
          console.log("================================");

          console.log("Commune :", data.commune);
          console.log("Année   :", data.annee);
          console.log("Nombre  :", data.count);

          if (data.commune !== "Liège") {
            throw new Error(
              "Commune incorrecte"
            );
          }

          if (data.annee !== 2026) {
            throw new Error(
              "Année incorrecte"
            );
          }

          if (data.count < 500) {
            throw new Error(
              "Moins de 500 décisions 2026"
            );
          }

          for (const decision of data.decisions) {

            if (!decision.date) {
              throw new Error(
                "Une décision 2026 n'a pas de date URL"
              );
            }

            if (decision.date.year !== 2026) {
              throw new Error(
                `Décision non-2026 détectée : ${decision.url}`
              );
            }

          }

          console.log(
            "✅ Toutes les décisions sont bien rattachées à 2026 par leur URL."
          );

          NODE

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-analysis
          path: tmp/liege-2026-analysis.json
          if-no-files-found: warn
