name: Test Liège 2026 - Extraction PDF

on:
  workflow_dispatch:

jobs:
  test-liege-pdf:
    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Installer Puppeteer
        run: |
          npm install --no-save --legacy-peer-deps puppeteer cheerio

      - name: Vérifier les fichiers
        run: |
          test -f scripts/scrape-liege-2026-v2.mjs
          test -f scripts/extract-liege-documents.mjs
          echo "✓ Fichiers présents"

      - name: Vérifier pdftotext
        run: |
          pdftotext -v

      - name: Collecter les décisions 2026
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Vérifier les décisions 2026
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const file =
            'tmp/liege-2026-analysis.json';

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log(`Commune : ${data.commune}`);
          console.log(`Année : ${data.annee}`);
          console.log(`Décisions : ${data.count}`);

          if (data.commune !== 'Liège') {
            throw new Error('Commune incorrecte');
          }

          if (data.annee !== 2026) {
            throw new Error('Année incorrecte');
          }

          if (data.count < 500) {
            throw new Error(
              `Seulement ${data.count} décisions`
            );
          }

          for (const d of data.decisions) {
            if (
              !d.date ||
              d.date.year !== 2026
            ) {
              throw new Error(
                `Décision non-2026 : ${d.url}`
              );
            }
          }

          console.log(
            '✓ Décisions 2026 validées'
          );
          EOF

      - name: Télécharger les vrais PDF et extraire le texte
        run: |
          node scripts/extract-liege-documents.mjs

      - name: Vérifier extraction
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const file =
            'tmp/liege-2026-texts.json';

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log('');
          console.log('================================');
          console.log('RÉSULTAT EXTRACTION');
          console.log('================================');
          console.log(
            `Décisions : ${data.count}`
          );
          console.log(
            `OK : ${data.extractionOk}`
          );
          console.log(
            `Échecs : ${data.extractionFailed}`
          );
          console.log(
            `Caractères : ${data.totalCharacters}`
          );

          if (data.commune !== 'Liège') {
            throw new Error(
              'Commune incorrecte'
            );
          }

          if (data.annee !== 2026) {
            throw new Error(
              'Année incorrecte'
            );
          }

          if (data.count < 500) {
            throw new Error(
              'Trop peu de décisions'
            );
          }

          /*
           * Pour ce test, on veut surtout connaître
           * le vrai taux de réussite.
           *
           * On ne bloque pas artificiellement le workflow
           * si certaines pages n'ont pas de PDF exploitable.
           */

          for (const d of data.decisions) {
            if (
              !d.date ||
              d.date.year !== 2026
            ) {
              throw new Error(
                `Décision non-2026 : ${d.url}`
              );
            }
          }

          console.log(
            '✓ Structure et année validées'
          );
          EOF

      - name: Vérifier production inchangée
        run: |
          if git diff --quiet -- src/data/reglements-taxes.json; then
            echo "✓ src/data/reglements-taxes.json inchangé"
          else
            echo "❌ DONNÉES DE PRODUCTION MODIFIÉES"
            exit 1
          fi

      - name: Sauvegarder le résultat
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-textes
          path: |
            tmp/liege-2026-analysis.json
            tmp/liege-2026-texts.json
          retention-days: 7
