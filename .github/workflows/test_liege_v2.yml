name: Test Liège 2026 - Classification fiscale

on:
  workflow_dispatch:

jobs:
  test-liege-classification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: |
          npm install --no-save --legacy-peer-deps puppeteer

      - name: Vérifier les scripts
        run: |
          test -f scripts/debug-scraper.mjs
          test -f scripts/scrape-liege-2026-v2.mjs
          test -f scripts/extract-liege-documents.mjs

      # ------------------------------------------------------
      # 1. COLLECTE DES 855 DÉCISIONS
      # ------------------------------------------------------

      - name: Collecte des décisions Liège 2026
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Vérifier la collecte
        run: |
          test -f tmp/liege-2026-analysis.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const data = JSON.parse(
            fs.readFileSync("tmp/liege-2026-analysis.json", "utf8")
          );

          const decisions =
            Array.isArray(data)
              ? data
              : data.decisions || data.items || [];

          console.log(`Décisions collectées : ${decisions.length}`);

          if (decisions.length < 800) {
            throw new Error(
              `Collecte insuffisante : ${decisions.length} décisions.`
            );
          }

          for (const d of decisions) {
            if (!/\/decisions\/\d{1,2}-[a-zà-ÿ]+-2026-\d{1,2}-\d{2}\//i.test(d.url)) {
              throw new Error(`Décision non-2026 : ${d.url}`);
            }
          }

          console.log("Validation de la collecte : OK");
          NODE

      # ------------------------------------------------------
      # 2. EXTRACTION DES DOCUMENTS / TEXTES
      # ------------------------------------------------------

      - name: Extraction des documents Liège 2026
        run: |
          node scripts/extract-liege-documents.mjs

      - name: Vérifier l'extraction
        run: |
          test -f tmp/liege-2026-texts.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const data = JSON.parse(
            fs.readFileSync("tmp/liege-2026-texts.json", "utf8")
          );

          const decisions =
            Array.isArray(data)
              ? data
              : data.decisions || data.items || [];

          console.log(`Textes extraits : ${decisions.length}`);

          if (decisions.length < 800) {
            throw new Error(
              `Extraction insuffisante : ${decisions.length} textes.`
            );
          }

          console.log("Validation de l'extraction : OK");
          NODE

      # ------------------------------------------------------
      # 3. CLASSIFICATION FISCALE
      # ------------------------------------------------------

      - name: Classification fiscale
        run: |
          node scripts/debug-scraper.mjs

      # ------------------------------------------------------
      # 4. NE RIEN MODIFIER EN PRODUCTION
      # ------------------------------------------------------

      - name: Vérifier que les données de production sont inchangées
        run: |
          git diff --exit-code -- src/data/reglements-taxes.json

      # ------------------------------------------------------
      # 5. CONSERVER LES RÉSULTATS
      # ------------------------------------------------------

      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-classification
          path: |
            tmp/liege-2026-analysis.json
            tmp/liege-2026-texts.json
          if-no-files-found: warn
