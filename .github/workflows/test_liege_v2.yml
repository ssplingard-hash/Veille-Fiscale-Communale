name: Test Liège 2026 V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-liege:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Installer Puppeteer
        run: |
          npm install --no-save --legacy-peer-deps puppeteer

      - name: Vérifier les outils
        run: |
          node --version
          npx puppeteer --version || true
          pdftotext -v

      - name: Lancer le nouveau scraper Liège
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Vérifier le fichier de diagnostic
        run: |
          test -f tmp/liege-2026-analysis.json
          ls -lh tmp/liege-2026-analysis.json

      - name: Publier le diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-analysis
          path: tmp/liege-2026-analysis.json
          retention-days: 7
