name: Test collecte Liège 2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-liege:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Puppeteer
        run: |
          npm install --no-save --legacy-peer-deps puppeteer

      - name: Vérifier Node et Puppeteer
        run: |
          node --version
          npx puppeteer --version

      - name: Tester la collecte Liège
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Vérifier le résultat
        run: |
          test -f tmp/liege-2026-analysis.json
          echo "Fichier créé :"
          ls -lh tmp/liege-2026-analysis.json

      - name: Sauvegarder le diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-analysis
          path: tmp/liege-2026-analysis.json
          retention-days: 7
