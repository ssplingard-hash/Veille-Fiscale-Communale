name: Test Liège 2026 - Extraction PDF

on:
  workflow_dispatch:

jobs:
  test-liege-pdf:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Installer Puppeteer
        run: |
          npm install --no-save --legacy-peer-deps puppeteer cheerio

      - name: Vérifier les fichiers
        run: |
          test -f scripts/scrape-liege-2026-v2.mjs
          test -f scripts/extract-liege-documents.mjs
          echo "✓ Fichiers présents"

      - name: Vérifier pdftotext
        run: |
          pdftotext -v

      - name: Collecter les décisions Liège 2026
        run: |
          node scripts/scrape-liege-2026-v2.mjs

      - name: Vérifier les décisions
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const file =
            'tmp/liege-2026-analysis.json';

          if (!fs.existsSync(file)) {
            throw new Error(
              `Fichier introuvable : ${file}`
            );
          }

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log(`Commune : ${data.commune}`);
          console.log(`Année : ${data.annee}`);
          console.log(`Décisions : ${data.count}`);

          if (data.commune !== 'Liège') {
            throw new Error('Commune incorrecte');
          }

          if (data.annee !== 2026) {
            throw new Error('Année incorrecte');
          }

          if (data.count < 500) {
            throw new Error(
              `Sécurité : seulement ${data.count} décisions`
            );
          }

          for (const decision of data.decisions) {
            if (
              !decision.date ||
              decision.date.year !== 2026
            ) {
              throw new Error(
                `Décision non-2026 : ${decision.url}`
              );
            }
          }

          console.log(
            '✓ Toutes les décisions sont bien de 2026'
          );
          EOF

      - name: Télécharger et extraire les PDF
        run: |
          node scripts/extract-liege-documents.mjs

      - name: Vérifier l'extraction
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const file =
            'tmp/liege-2026-texts.json';

          if (!fs.existsSync(file)) {
            throw new Error(
              `Fichier introuvable : ${file}`
            );
          }

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log('');
          console.log('================================');
          console.log('VÉRIFICATION EXTRACTION');
          console.log('================================');

          console.log(
            `Décisions : ${data.count}`
          );

          console.log(
            `Extraction OK : ${data.extractionOk}`
          );

          console.log(
            `Extraction échouée : ${data.extractionFailed}`
          );

          console.log(
            `Caractères extraits : ${data.totalCharacters}`
          );

          if (data.commune !== 'Liège') {
            throw new Error(
              'Commune incorrecte'
            );
          }

          if (data.annee !== 2026) {
            throw new Error(
              'Année incorrecte'
            );
          }

          if (data.count < 500) {
            throw new Error(
              `Seulement ${data.count} décisions`
            );
          }

          if (data.extractionFailed > 50) {
            throw new Error(
              `Trop d'échecs : ${data.extractionFailed}`
            );
          }

          for (
            const decision of data.decisions
          ) {
            if (
              !decision.date ||
              decision.date.year !== 2026
            ) {
              throw new Error(
                `Décision non-2026 : ${decision.url}`
              );
            }

            if (
              !decision.pdfUrl
            ) {
              throw new Error(
                `PDF manquant : ${decision.url}`
              );
            }

            if (
              decision.extractionOk &&
              decision.textLength < 20
            ) {
              throw new Error(
                `Texte trop court : ${decision.url}`
              );
            }
          }

          console.log('');
          console.log(
            '✓ Extraction validée'
          );
          EOF

      - name: Vérifier que la production est intacte
        run: |
          if git diff --quiet -- src/data/reglements-taxes.json; then
            echo "✓ src/data/reglements-taxes.json inchangé"
          else
            echo "❌ LE FICHIER DE PRODUCTION A ÉTÉ MODIFIÉ"
            exit 1
          fi

      - name: Résumé
        run: |
          echo ""
          echo "=============================================="
          echo " TEST TERMINÉ"
          echo "=============================================="
          echo ""
          echo "858 décisions 2026 : collectées"
          echo "PDF : téléchargés"
          echo "Texte : extrait"
          echo "Production : inchangée"
          echo ""

      - name: Sauvegarder le résultat
        uses: actions/upload-artifact@v4
        with:
          name: liege-2026-textes
          path: |
            tmp/liege-2026-analysis.json
            tmp/liege-2026-texts.json
          retention-days: 7
